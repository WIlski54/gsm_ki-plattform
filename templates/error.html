{% extends "base.html" %}

{% block title %}Fehler · KI-Projektplattform{% endblock %}

{% block content %}
<div class="p-6 lg:p-10 flex items-center justify-center min-h-[60vh] animate-fade-in">
    
    <div class="text-center">
        <div class="w-24 h-24 mx-auto mb-6 rounded-2xl bg-red-100 flex items-center justify-center">
            <i data-lucide="alert-triangle" class="w-12 h-12 text-red-500"></i>
        </div>
        <h1 class="font-display font-extrabold text-3xl text-zinc-900 mb-3">
            Ups!
        </h1>
        <p class="text-zinc-500 mb-8 max-w-md mx-auto">
            {{ error or 'Ein unerwarteter Fehler ist aufgetreten.' }}
        </p>
        <a href="{{ url_for('index') }}" 
           class="inline-flex items-center gap-2 px-6 py-3 rounded-xl bg-indigo-600 text-white font-semibold hover:bg-indigo-700 transition-colors">
            <i data-lucide="home" class="w-5 h-5"></i>
            Zurück zur Startseite
        </a>
    </div>
    
</div>
{% endblock %}

{% block scripts %}
<script>
    lucide.createIcons();
</script>
{% endblock %}
